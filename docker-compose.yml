services:
  vue:
    build:
      context: .
      args: { APP: vue }
    command: ["serve", "-s", "dist", "-l", "4173"]
    expose: ["4173"]
  react:
    build:
      context: .
      args: { APP: react }
    command: ["serve", "-s", "dist", "-l", "4174"]
    expose: ["4174"]
  nginx:
    image: nginx:1.27-alpine
    ports: ["3000:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [vue, react]
