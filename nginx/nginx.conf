events {}
http {
  include /etc/nginx/mime.types;
  server {
    listen 80;
    server_name _;
    # Keep the Docker host port (for example :3000) when redirecting.
    # Without this, nginx can generate http://localhost/vue/page-1 because
    # the container itself listens on port 80.
    absolute_redirect off;

    location = / { return 302 /page-1; }

    # Public routes: nginx owns the migration decision.
    # Move a route from one upstream to the other to switch frameworks.
    location = /page-1 { proxy_pass http://vue:4173/; }
    location = /page-2 { proxy_pass http://vue:4173/; }
    location = /page-3 { proxy_pass http://react:4174/; }
    location = /page-4 { proxy_pass http://react:4174/; }
    location /vue/ {
      # The trailing slash strips /vue/ before forwarding to the static server.
      proxy_pass http://vue:4173/;
      proxy_set_header Host $host;
    }
    location /react/ {
      # The trailing slash strips /react/ before forwarding to the static server.
      proxy_pass http://react:4174/;
      proxy_set_header Host $host;
    }
  }
}
